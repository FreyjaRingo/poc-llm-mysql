# Tema dashboard. Warna dan font diatur di sini, bukan dengan CSS.
[client]
toolbarMode = "minimal"   # sembunyikan tombol Deploy

[theme]
base = "light"
primaryColor = "#2a78d6"            # sama dengan warna grafik satu seri
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1f2733"
linkColor = "#2a78d6"
borderColor = "#dfe3ea"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "12.5px"
headingFontSizes = ["26px", "20px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
dataframeHeaderBackgroundColor = "#f4f6f9"

[theme.sidebar]
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
